name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach binaries to releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FUSE (integration tests mount a filesystem)
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/pdfcbzfs-linux-${{ matrix.goarch }} ./cmd/pdfcbzfs
          file dist/pdfcbzfs-linux-${{ matrix.goarch }} || true
          ls -l dist
      # The renderer: a small C helper plus PDFium. Without it pages that
      # cannot be extracted stay PDFs; with it they are drawn.
      - name: Cross compiler for the arm64 helper
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build render helper
        run: sh helper/build.sh ${{ matrix.goarch }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcbzfs-linux-${{ matrix.goarch }}
          path: |
            dist/pdfcbzfs-linux-${{ matrix.goarch }}
            dist/pdfcbzfs-render-linux-${{ matrix.goarch }}.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pdfcbzfs-linux-${{ matrix.goarch }}
            dist/pdfcbzfs-render-linux-${{ matrix.goarch }}.tar.gz

  # Rolling pre-release: every push to master replaces the "latest" assets.
  latest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: rolling-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pdfcbzfs-linux-*
          merge-multiple: true
      - name: Move the latest tag to this commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (master ${{ github.sha }})
          prerelease: true
          body: Automatic build of master at ${{ github.sha }}. Use a v* release for a stable version.
          files: |
            dist/pdfcbzfs-linux-*
            dist/pdfcbzfs-render-linux-*.tar.gz
