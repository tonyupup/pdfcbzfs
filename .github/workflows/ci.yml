name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach binaries to releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FUSE (integration tests mount a filesystem)
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/pdfcbzfs-linux-${{ matrix.goarch }} ./cmd/pdfcbzfs
          file dist/pdfcbzfs-linux-${{ matrix.goarch }} || true
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcbzfs-linux-${{ matrix.goarch }}
          path: dist/pdfcbzfs-linux-${{ matrix.goarch }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pdfcbzfs-linux-${{ matrix.goarch }}
